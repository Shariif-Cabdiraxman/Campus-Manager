name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (PHP syntax + code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, pdo_mysql
          ini-values: error_reporting=E_ALL

      - name: PHP syntax check
        run: |
          find . -type d \( -name .git -o -name vendor \) -prune -o -type f -name '*.php' -print0 \
            | xargs -0 -r -n1 php -l

      - name: Check for trailing whitespace
        run: |
          if grep -r '[[:space:]]$' --include='*.php' --include='*.css' --include='*.js' .; then
            echo "Trailing whitespace found"
            exit 1
          fi
      - name: Check for unresolved merge markers
        run: |
          if grep -rEn '^(<<<<<<< |>>>>>>>)' --exclude-dir=.git --include='*.php' --include='*.css' --include='*.js' --include='*.yml' .; then
            echo "Unresolved merge markers found"
            exit 1
          fi

  test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: university_management
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, pdo_mysql

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -proot && break
            sleep 2
          done

      - name: Import schema
        run: mysql -h 127.0.0.1 -u root -proot university_management < database.sql

      - name: Configure database
        run: |
          cp config/database.example.php config/database.php

      - name: Run desktop and mobile smoke suites
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: university_management
          DB_USER: root
          DB_PASS: root
          UMS_BASE_URL: http://127.0.0.1:8080
          UMS_MYSQL: /usr/bin/mysql
          UMS_DB_USER: root
          UMS_DB_PASS: root
          UMS_DB_HOST: 127.0.0.1
          UMS_DB_PORT: 3306
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/hagmah-php-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$UMS_BASE_URL/auth/login.php" > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/hagmah-php-server.log
            exit 1
          fi

          pwsh -NoLogo -NoProfile -File tools/smoke_modules.ps1
          pwsh -NoLogo -NoProfile -File tools/smoke_mobile.ps1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          # Match likely secret literals, not request variables or HTML attributes.
          if grep -rPn --include='*.php' --exclude-dir=.git --exclude-dir=vendor \
            '\$[A-Za-z_][A-Za-z0-9_]*(password|passwd|secret|token|api_key)[A-Za-z0-9_]*\s*=\s*["\x27][^"\x27]{8,}' .; then
            echo "Potential hardcoded secret literal found"
            exit 1
          fi

      - name: Verify CSP headers in init.php
        run: |
          if ! grep -q "Content-Security-Policy" includes/init.php; then
            echo "CSP header missing from init.php"
            exit 1
          fi
