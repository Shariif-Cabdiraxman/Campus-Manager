name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (PHP syntax + code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, pdo_mysql
          ini-values: error_reporting=E_ALL

      - name: PHP syntax check
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Check for trailing whitespace
        run: |
          if grep -r '[[:space:]]$' --include='*.php' --include='*.css' --include='*.js' .; then
            echo "Trailing whitespace found"
            exit 1
          fi

  test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: university_management
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, pdo_mysql

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root -proot && break
            sleep 2
          done

      - name: Import schema
        run: mysql -h 127.0.0.1 -u root -proot university_management < database.sql

      - name: Configure database
        run: |
          cat > config/database.php <<'EOF'
          <?php
          define('DB_HOST', '127.0.0.1');
          define('DB_PORT', 3306);
          define('DB_NAME', 'university_management');
          define('DB_USER', 'root');
          define('DB_PASS', 'root');
          EOF

      - name: Run desktop smoke tests
        run: |
          # Note: PowerShell smoke tests need adaptation for Linux
          # This is a placeholder - the actual smoke tests are PowerShell-based
          echo "Desktop smoke tests would run here"

      - name: Run mobile smoke tests
        run: |
          echo "Mobile smoke tests would run here"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          # Basic secret patterns
          if grep -r "password\s*=" --include="*.php" --include="*.env*" . | grep -v "password_hash" | grep -v "DB_PASS" | grep -v "example" | grep -v ".gitignore"; then
            echo "Potential hardcoded secrets found"
            exit 1
          fi

      - name: Verify CSP headers in init.php
        run: |
          if ! grep -q "Content-Security-Policy" includes/init.php; then
            echo "CSP header missing from init.php"
            exit 1
          fi

      - name: Check prepared statements usage
        run: |
          # Ensure no direct query concatenation with variables
          if grep -r 'db_query\|db_execute\|db_row\|db_all\|db_value' --include="*.php" . | grep -v "prepare\|bind_param\|?"; then
            echo "Potential raw query usage found - review needed"
          fi
